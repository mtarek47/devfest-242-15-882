<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Document Package Builder</title>
<!-- Local bundle with CDN fallback -->
<script src="pdf-lib.min.js"></script>
<script>
if (typeof PDFLib === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"><\/script>');
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN SYSTEM: INDUSTRIAL SKEUOMORPHISM (INDUSTRIAL REALISM)
   Inspired by Dieter Rams, Teenage Engineering & 1980s Braun
   ========================================================= */

:root {
  box-sizing: border-box;

  /* Industrial Material Palette (Strict Light Mode Workshop Lighting) */
  --bg: #e0e5ec;             /* Level 0: Matte ABS Plastic Chassis */
  --pn: #e0e5ec;             /* Level 1: Bolted Panel Surface */
  --pn-raised: #e8ecf2;      /* Elevated component surface */
  --pn-recessed: #d1d9e6;    /* Level -1: Sunken/Machined Wells */
  --ink: #2d3436;            /* Primary dark charcoal ink */
  --ink-soft: #4a5568;       /* Technical slate labels */
  --mu: #4a5568;             /* WCAG AA compliant label text */
  --ln: #babecc;             /* Shadow half of lighting equation */
  --ln-light: #ffffff;       /* Highlight half of lighting equation */
  --ln-dark: #a3b1c6;        /* Prominent machined divider */

  /* Safety Orange / Braun Red Accent (Interactive & Critical Triggers) */
  --ac: #ff4757;
  --ac-hover: #ff6b81;
  --ac-light: #ffe5e8;
  --ac-glow: rgba(255, 71, 87, 0.6);

  /* Status Colors with Hardware Glow */
  --ok: #22c55e;
  --ok-bg: #d1fae5;
  --ok-glow: rgba(34, 197, 94, 0.7);
  --bad: #ff4757;
  --bad-bg: #ffe4e6;
  --bad-glow: rgba(255, 71, 87, 0.7);
  --warn: #f59e0b;
  --warn-bg: #fef3c7;
  --warn-glow: rgba(245, 158, 11, 0.7);
  --gr: #64748b;
  --gr-bg: #e2e8f0;

  /* Neumorphic Dual Shadow Equations (Consistent 45° Top-Left Light) */
  --shadow-card: 8px 8px 16px #babecc, -8px -8px 16px #ffffff;
  --shadow-floating: 10px 10px 20px #babecc, -10px -10px 20px #ffffff;
  --shadow-pressed: inset 5px 5px 10px #babecc, inset -5px -5px 10px #ffffff;
  --shadow-recessed: inset 3px 3px 6px #babecc, inset -3px -3px 6px #ffffff;
  --shadow-sharp: 3px 3px 6px rgba(0,0,0,0.12), -1px -1px 1px #ffffff;

  /* Typography Stacks */
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
  --font-mono: "JetBrains Mono", "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  /* Micro-texture simulated via subtle radial highlights */
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(255,255,255,0.4) 0%, transparent 60%),
    radial-gradient(circle at 85% 85%, rgba(186,190,204,0.3) 0%, transparent 60%);
  color: var(--ink);
  font: 14px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* =========================================================
   TOP CHASSIS RAIL (HEADER)
   ========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px;
  background: var(--bg);
  box-shadow: 0 6px 14px #babecc, 0 1px 0 #ffffff;
  border-bottom: 1px solid var(--ln);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon-housing {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: var(--shadow-floating);
  color: var(--ac);
}

.brand h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  text-shadow: 0 1px 0 #ffffff;
}

.nav-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

/* =========================================================
   PHYSICAL BUTTONS & MECHANICAL SWITCHES
   ========================================================= */
button, .btn {
  font: 600 12px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink);
  border: none;
  background: var(--bg);
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 5px 5px 10px #babecc, -5px -5px 10px #ffffff;
  transition: all 150ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
  user-select: none;
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
}

button:hover:not(:disabled), .btn:hover {
  color: var(--ac);
  transform: translateY(-1px);
  box-shadow: 7px 7px 14px #babecc, -7px -7px 14px #ffffff;
}

/* Mechanical Button Press Physics (Shadow Inversion + Translation) */
button:active:not(:disabled), .btn:active {
  transform: translateY(2px);
  box-shadow: var(--shadow-pressed) !important;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: inset 1px 1px 2px #babecc, inset -1px -1px 2px #ffffff !important;
}

/* Safety Orange Primary Trigger Button */
.pri {
  background: var(--ac) !important;
  color: #ffffff !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3) !important;
  box-shadow: 5px 5px 12px rgba(186, 50, 60, 0.45), -5px -5px 12px #ffffff !important;
}

.pri:hover:not(:disabled) {
  background: var(--ac-hover) !important;
  color: #ffffff !important;
  box-shadow: 7px 7px 16px rgba(186, 50, 60, 0.55), -7px -7px 16px #ffffff !important;
}

.pri:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: inset 4px 4px 8px rgba(120, 15, 25, 0.6), inset -4px -4px 8px rgba(255, 120, 130, 0.6) !important;
}

.btn-success {
  background: var(--ok) !important;
  color: #ffffff !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3) !important;
  box-shadow: 5px 5px 12px rgba(20, 120, 50, 0.45), -5px -5px 12px #ffffff !important;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 11px;
  border-radius: 6px;
}

.btn-danger {
  color: var(--bad);
}

.btn-danger:hover:not(:disabled) {
  background: var(--bad-bg);
  box-shadow: inset 2px 2px 5px #babecc, inset -2px -2px 5px #ffffff;
}

/* =========================================================
   LAYOUT & CONTAINER
   ========================================================= */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px;
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 24px;
}

@media (max-width: 960px) {
  main { grid-template-columns: 1fr; }
}

/* =========================================================
   BOLTED MODULES (CARDS WITH CORNER SCREWS & VENTS)
   ========================================================= */
.card {
  position: relative;
  background-color: var(--pn);
  /* Corner Screws simulated via radial gradients at 14px */
  background-image: 
    radial-gradient(circle at 14px 14px, #a3b1c6 1.5px, #d1d9e6 2.5px, transparent 3.5px),
    radial-gradient(circle at calc(100% - 14px) 14px, #a3b1c6 1.5px, #d1d9e6 2.5px, transparent 3.5px),
    radial-gradient(circle at 14px calc(100% - 14px), #a3b1c6 1.5px, #d1d9e6 2.5px, transparent 3.5px),
    radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #a3b1c6 1.5px, #d1d9e6 2.5px, transparent 3.5px);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(255, 255, 255, 0.7);
}

.card h2 {
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0 0 14px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--ink);
  text-shadow: 0 1px 0 #ffffff;
}

/* Card Cooling Vents Decoration */
.card-vents {
  display: inline-flex;
  gap: 4px;
  margin-left: 10px;
}

.vent-slot {
  width: 3px;
  height: 16px;
  border-radius: 3px;
  background: var(--pn-recessed);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.25), inset -1px -1px 2px #ffffff;
}

/* =========================================================
   TENDER METADATA RECESS (LEVEL -1 PANEL)
   ========================================================= */
.tender-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-top: 10px;
  background: var(--pn-recessed);
  padding: 14px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow-recessed);
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.meta-item .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mu);
  font-weight: 700;
}

.meta-item .val {
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  word-break: break-word;
}

.meta-item .val.deadline {
  color: var(--ac);
  font-weight: 700;
}

/* =========================================================
   HARDWARE STATUS LEDS & COUNTER RIBBON
   ========================================================= */
.stats-ribbon {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #c8d0de;
}

.stat-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--bg);
  box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
}

/* Glowing LED Dots */
.led {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.led-ok {
  background: var(--ok);
  box-shadow: var(--ok-glow);
}

.led-bad {
  background: var(--bad);
  box-shadow: var(--bad-glow);
  animation: ledPulse 1.8s infinite;
}

.led-warn {
  background: var(--warn);
  box-shadow: var(--warn-glow);
}

.led-muted {
  background: #94a3b8;
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
}

@keyframes ledPulse {
  0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px var(--bad)); }
  50% { opacity: 0.45; filter: none; }
}

/* =========================================================
   REQUIREMENTS MACHINERY (DATA-SLOT ROWS)
   ========================================================= */
.req {
  padding: 14px 12px;
  border-top: 1px solid #c8d0de;
  display: grid;
  gap: 10px;
  transition: all 0.15s ease;
  border-radius: 8px;
}

.req:hover {
  background: rgba(255,255,255,0.4);
}

.req-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.req-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

.req-order {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--bg);
  box-shadow: inset 2px 2px 4px #babecc, inset -2px -2px 4px #ffffff;
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 11px;
}

.req-badges {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--bg);
  box-shadow: inset 2px 2px 4px #babecc, inset -2px -2px 4px #ffffff;
  color: var(--mu);
}

.pill-mand {
  color: #1d4ed8;
}

.pill-exp {
  color: #b45309;
}

/* Hardware Status Tags */
.tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  border-radius: 6px;
  padding: 3px 9px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
}

.tag.OK {
  color: var(--ok);
  background: var(--bg);
}

.tag.Missing, .tag.Expired, .tag.NeedExp {
  color: var(--bad);
  background: var(--bg);
}

.tag.NotProv {
  color: var(--gr);
  background: var(--bg);
}

.tag.dup {
  color: var(--warn);
  background: var(--bg);
}

/* =========================================================
   RECESSED DATA INPUTS ("DATA SLOTS")
   ========================================================= */
.req-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

select, input[type="date"], input[type="text"] {
  border: none !important;
  background: var(--pn-recessed);
  box-shadow: var(--shadow-recessed);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink);
  outline: none;
  transition: all 150ms ease;
}

select:focus, input[type="date"]:focus, input[type="text"]:focus {
  box-shadow: var(--shadow-recessed), 0 0 0 2px var(--ac);
}

.exp-field {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
}

.exp-hint {
  font-size: 11px;
  font-weight: 700;
}

.exp-hint.valid { color: var(--ok); }
.exp-hint.invalid { color: var(--bad); }

/* =========================================================
   FILE CHASSIS & DROP-ZONE WELL
   ========================================================= */
.drop-zone {
  background: var(--pn-recessed);
  box-shadow: var(--shadow-recessed);
  border: 2px dashed #a3b1c6;
  border-radius: 12px;
  padding: 24px 16px;
  text-align: center;
  transition: all 0.2s ease;
  cursor: pointer;
}

.drop-zone.dragover {
  border-color: var(--ac);
  background: #c5cedd;
  box-shadow: inset 4px 4px 10px #a3b1c6, inset -4px -4px 10px #ffffff;
}

.drop-zone p {
  margin: 10px 0 0;
  font-size: 11.5px;
  color: var(--mu);
  font-family: var(--font-mono);
}

.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  box-shadow: 3px 3px 6px #babecc, -3px -3px 6px #ffffff;
  border-radius: 8px;
  margin-top: 8px;
  transition: all 0.15s ease;
}

.file-item:hover {
  transform: translateY(-1px);
  box-shadow: 4px 4px 8px #babecc, -4px -4px 8px #ffffff;
}

.file-name {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  color: var(--ink);
}

.file-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--mu);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 2px;
}

/* =========================================================
   GENERATION PANEL & SYSTEM FEEDBACK
   ========================================================= */
.blocking-box {
  background: #fce8e8;
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
  color: #991b1b;
  box-shadow: var(--shadow-recessed);
  border-left: 4px solid var(--bad);
}

.blocking-box b {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-family: var(--font-mono);
}

.blocking-box ul {
  margin: 8px 0 0;
  padding-left: 20px;
  font-size: 12.5px;
  font-family: var(--font-sans);
}

.ready-box {
  background: #e6f9ed;
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
  color: #14532d;
  font-size: 13px;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-recessed);
  border-left: 4px solid var(--ok);
}

.gen-options {
  background: var(--pn-recessed);
  box-shadow: var(--shadow-recessed);
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  font-size: 12.5px;
  font-family: var(--font-sans);
}

.gen-options label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
}

/* Physical Checkboxes */
input[type="checkbox"], input[type="radio"] {
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--bg);
  box-shadow: inset 2px 2px 4px #babecc, inset -2px -2px 4px #ffffff;
  outline: none;
  cursor: pointer;
  display: inline-grid;
  place-content: center;
  transition: all 0.15s ease;
}

input[type="radio"] {
  border-radius: 50%;
}

input[type="checkbox"]:checked, input[type="radio"]:checked {
  background: var(--ac);
  box-shadow: 0 0 6px var(--ac-glow);
}

input[type="checkbox"]:checked::before {
  content: "";
  width: 8px;
  height: 8px;
  background: #ffffff;
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}

input[type="radio"]:checked::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffffff;
}

/* Notifications Toast */
.toast-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.toast {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 12.5px;
  font-family: var(--font-mono);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-card);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.toast-err {
  background: #ffe4e6;
  color: #9f1239;
  border-left: 4px solid var(--bad);
}

.toast-ok {
  background: #d1fae5;
  color: #065f46;
  border-left: 4px solid var(--ok);
}

.toast-warn {
  background: #fef3c7;
  color: #92400e;
  border-left: 4px solid var(--warn);
}

.toast-close {
  cursor: pointer;
  font-weight: 800;
  padding-left: 10px;
}

.pdf-summary {
  margin-top: 16px;
  padding: 14px 18px;
  background: var(--pn-recessed);
  border-radius: 10px;
  box-shadow: var(--shadow-recessed);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
}
.bonus-panel {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ac)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <h1 id="appTitle">Tender Document Package Builder</h1>
  </div>
  <div class="nav-actions">
    <label class="btn btn-sm" id="btnReqLabel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/></svg>
      <span id="txtLoadReq">Open requirements.json</span>
      <input type="file" id="reqInput" accept=".json,application/json" hidden>
    </label>
    <button class="btn btn-sm" id="btnSamplePack" title="Load sample tender pack demonstration">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span id="txtSamplePack">Demo Sample Pack</span>
    </button>
    <button class="btn btn-sm" id="btnExportCsv" title="Export requirements checklist as CSV">

let currentLang = "en";
let tenderData = null;
let requirements = [];
let uploadedFiles = [];
let matches = {};      // reqId -> fileId
let expiryDates = {};  // reqId -> YYYY-MM-DD
let toastMessages = [];
let generatedPackage = null;
let sealImageBytes = null;
let fileUidCounter = 0;

const t = key => I18N[currentLang][key];
const $ = id => document.getElementById(id);
const escapeHtml = str => String(str || "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

const getFileById = id => uploadedFiles.find(f => f.id === id);
const getFilesWithSameHash = f => uploadedFiles.filter(x => x.hash === f.hash);

// Status Evaluation
function evaluateStatus(r) {
  const f = getFileById(matches[r.id]);
  if (!f) return r.mandatory ? "Missing" : "NotProv";
  if (r.has_expiry) {
    const e = expiryDates[r.id];
    if (!e) return "NeedExp";
    if (tenderData && e < tenderData.submission_deadline) return "Expired";
  }
  return "OK";
}

const isBlockingStatus = s => ["Missing", "NeedExp", "Expired"].includes(s);
const bufferToHex = buffer => [...new Uint8Array(buffer)].map(x => x.toString(16).padStart(2, "0")).join("");

// Eligible files for a requirement dropdown
// Prevent assigning duplicate content to multiple documents (Task 4.6)
function getEligibleFiles(reqId) {
  const usedFiles = Object.entries(matches)
    .filter(([k]) => k !== reqId)
    .map(([, v]) => getFileById(v))
    .filter(Boolean);

  return uploadedFiles.filter(f => !usedFiles.some(u => u.id === f.id || u.hash === f.hash));
}

// Push toast message
function addToast(msg, type = "err") {
  toastMessages.push({ id: Date.now() + Math.random(), msg, type });
  renderToasts();
}

function removeToast(id) {
  toastMessages = toastMessages.filter(m => m.id !== id);
  renderToasts();
}

function renderToasts() {
  const box = $("toastBox");
  box.innerHTML = toastMessages.map(m => `
    <div class="toast toast-${m.type}">
      <span>${escapeHtml(m.msg)}</span>
      <span class="toast-close" onclick="removeToast(${m.id})">&times;</span>
    </div>
  `).join("");
}

// File Upload Handler
async function handleFilesUpload(fileList) {
  for (const file of fileList) {
    // 4.2 Validate PDF
    const isPdfExt = /\.pdf$/i.test(file.name);
    const isPdfMime = file.type === "application/pdf" || file.type === "";
    if (!isPdfExt && !isPdfMime) {
      addToast(t("notPdf")(file.name), "err");
      continue;
    }

    const arrayBuffer = await file.arrayBuffer();
    const bytes = new Uint8Array(arrayBuffer);
    
    // Check %PDF- header magic bytes
    if (bytes.length < 5 || String.fromCharCode(...bytes.slice(0, 5)) !== "%PDF-") {
      addToast(t("notPdf")(file.name), "err");
      continue;
    }

    // Limit check
    const totalSize = uploadedFiles.reduce((s, f) => s + f.size, 0) + file.size;
    if (uploadedFiles.length >= 30 || totalSize > 50 * 1024 * 1024) {
      addToast(t("limExceeded"), "warn");
      break;
    }

    // Load PDF safely (Bonus: Handle bad/password-protected files)
    let pageCount;
    try {
      const pdfDoc = await PDFDocument.load(bytes, { ignoreEncryption: false });
      pageCount = pdfDoc.getPageCount();
    } catch (err) {
      addToast(t("badFile")(file.name), "err");
      continue;
    }

    const hashBuffer = await crypto.subtle.digest("SHA-256", bytes);
    const hashHex = bufferToHex(hashBuffer);

    uploadedFiles.push({
      id: ++fileUidCounter,
      name: file.name,
      size: file.size,
      bytes: bytes,
      pages: pageCount,
      hash: hashHex
    });
  }

  generatedPackage = null;
  saveToLocalStorage();
  render();
}

function removeFile(fileId) {
  uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
  for (const rid in matches) {
    if (matches[rid] === fileId) delete matches[rid];
  }
  generatedPackage = null;
  saveToLocalStorage();
  render();
}

function setRequirementMatch(reqId, fileIdStr) {
  if (fileIdStr) {
    matches[reqId] = parseInt(fileIdStr, 10);
  } else {
    delete matches[reqId];
  }
  generatedPackage = null;
  saveToLocalStorage();
  render();
}

function setExpiryDate(reqId, val) {
  if (val) {
    expiryDates[reqId] = val;
  } else {
    delete expiryDates[reqId];
  }
  generatedPackage = null;
  saveToLocalStorage();
  render();
}

// Auto-Match Bonus Feature
function autoMatchDocuments() {
  let matchedCount = 0;
  requirements.forEach(req => {
    if (matches[req.id]) return; // already matched
    const eligible = getEligibleFiles(req.id);
    if (!eligible.length) return;

    const normTitle = req.title_en.toLowerCase();

    // Heuristics based on filenames
    const candidate = eligible.find(f => {
      const fn = f.name.toLowerCase();
      if (normTitle.includes("trade license") && fn.includes("trade_license_2026")) return true;
      if (normTitle.includes("trade license") && fn.includes("trade_license") && !eligible.some(x => x.name.includes("2026"))) return true;
      if (normTitle.includes("tin") && fn.includes("tin")) return true;
      if (normTitle.includes("vat") && fn.includes("vat")) return true;
      if (normTitle.includes("solvency") && fn.includes("solvency")) return true;
      if (normTitle.includes("experience") && fn.includes("experience")) return true;
      if (normTitle.includes("technical proposal") && fn.includes("technical")) return true;
      if (normTitle.includes("financial proposal") && fn.includes("financial")) return true;
      if (normTitle.includes("declaration") && (fn.includes("declaration") || fn.includes("scan_0042"))) return true;
      return false;
    });

    if (candidate) {
      matches[req.id] = candidate.id;
      matchedCount++;

      // Pre-fill known valid expiry dates from sample documents
      if (req.has_expiry && !expiryDates[req.id]) {
        if (candidate.name.includes("trade_license_2026")) expiryDates[req.id] = "2027-06-30";
        if (candidate.name.includes("bank_solvency")) expiryDates[req.id] = "2026-12-31";
      }
    }
  });

  if (matchedCount > 0) {
    addToast(t("autoMatchSuccess")(matchedCount), "ok");
  } else {
    addToast(t("autoMatchNone"), "warn");
  }

  generatedPackage = null;
  saveToLocalStorage();
  render();
}

// Export Checklist as CSV (Bonus)
function exportChecklistCsv() {
  if (!tenderData || !requirements.length) {
    addToast("Load requirements first to export checklist.", "warn");
    return;
  }
  const headers = ["Order", "ID", "Title (EN)", "Title (BN)", "Mandatory", "Expiry Required", "Matched File", "Pages", "Expiry Date", "Status"];
  const rows = requirements.map(r => {
    const f = getFileById(matches[r.id]);
    const s = evaluateStatus(r);
    return [
      r.order,
      r.id,
      `"${(r.title_en||"").replace(/"/g, '""')}"`,
      `"${(r.title_bn||"").replace(/"/g, '""')}"`,
      r.mandatory ? "Yes" : "No",
      r.has_expiry ? "Yes" : "No",
      f ? `"${f.name.replace(/"/g, '""')}"` : '""',
      f ? f.pages : 0,
      expiryDates[r.id] || "",
      s
    ].join(",");
  });

  const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${tenderData.tender_id}_Checklist.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Save / Restore Workspace (Bonus)
function saveToLocalStorage() {
  try {
    const state = {
      currentLang,
      tenderData,
      requirements,
      matches,
      expiryDates
    };
    localStorage.setItem("devfest_tender_builder_state", JSON.stringify(state));
  } catch(e) {}
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem("devfest_tender_builder_state");
    if (!raw) return;
    const state = JSON.parse(raw);
    if (state.tenderData && state.requirements) {
      tenderData = state.tenderData;
      requirements = state.requirements;
      matches = state.matches || {};
      expiryDates = state.expiryDates || {};
      if (state.currentLang) currentLang = state.currentLang;
    }
  } catch(e) {}
}

// PDF Package Generation (Section 6)
async function generatePackage() {
  const btn = $("btnGenerate");
  btn.disabled = true;
  if ($("txtBtnGen")) {
    $("txtBtnGen").textContent = t("building");
  }

  try {
    const includedReqs = requirements.filter(r => getFileById(matches[r.id]));
    const outPdf = await PDFDocument.create();
    const font = await outPdf.embedFont(StandardFonts.Helvetica);
    const boldFont = await outPdf.embedFont(StandardFonts.HelveticaBold);

    // Prepare embedded documents
    const docEntries = [];
    for (const r of includedReqs) {
      const f = getFileById(matches[r.id]);
      let srcDoc;
      if (f.bytes && f.bytes.length > 0) {
        srcDoc = await PDFDocument.load(f.bytes);
      } else {
        // Graceful fallback for mock/demo preview
        srcDoc = await PDFDocument.create();
        const dummyPage = srcDoc.addPage([595.28, 841.89]);
        dummyPage.drawText(`Verified Document: ${f.name}`, { x: 50, y: 750, size: 16 });
      }
      docEntries.push({ req: r, file: f, srcDoc, pages: f.pages || srcDoc.getPageCount() });
    }

    // Sort strictly by order (Section 6.2)
    docEntries.sort((a, b) => a.req.order - b.req.order);

    const isIndexPageRequested = $("chkIndexPage").checked;
    const coverPageCount = 1;
    const indexPageCount = isIndexPageRequested ? 1 : 0;
    
    let currentStartPage = 1 + coverPageCount + indexPageCount;
    const mappedRows = docEntries.map(entry => {
      const a = currentStartPage;
      currentStartPage += entry.pages;
      return { ...entry, startPage: a, endPage: currentStartPage - 1 };
    });

    const totalPackagePages = currentStartPage - 1;
    const FOOTER_HEIGHT = 30; // Dedicated footer margin to guarantee 6.4

    const safeAscii = s => String(s || "").replace(/[^\x20-\x7E]/g, "?");

    // ==========================================
    // 6.1 PAGE 1: COVER PAGE (in English)
    // ==========================================
    const coverPage = outPdf.addPage([595.28, 841.89 + FOOTER_HEIGHT]);
    let cy = 841.89 + FOOTER_HEIGHT - 65;

    // Header Title
    coverPage.drawText("Tender Document Package", {
      x: 50,
      y: cy,
      size: 24,
      font: boldFont,
      color: rgb(0.06, 0.32, 0.45)
    });
    cy -= 32;

    const tenderMetaLines = [
      ["Tender ID", tenderData.tender_id],
      ["Title", tenderData.title],
      ["Procuring entity", tenderData.procuring_entity],
      ["Bidder", tenderData.bidder],
      ["Submission deadline", tenderData.submission_deadline],
      ["Package date", new Date().toISOString().slice(0, 10)]
    ];

    tenderMetaLines.forEach(([label, val]) => {
      coverPage.drawText(`${label}:`, {
        x: 50,
        y: cy,
        size: 11,
        font: boldFont,
        color: rgb(0.1, 0.15, 0.2)
      });
      coverPage.drawText(safeAscii(val).slice(0, 75), {
        x: 185,
        y: cy,
        size: 11,
        font: font,
        color: rgb(0.2, 0.25, 0.3)
      });
      cy -= 20;
    });

    cy -= 14;
    coverPage.drawText("Included documents", {
      x: 50,
      y: cy,
      size: 14,
      font: boldFont,
      color: rgb(0.06, 0.32, 0.45)
    });
    cy -= 20;

    mappedRows.forEach(row => {
      if (cy > FOOTER_HEIGHT + 35) {
        const itemTitle = `${row.req.order}. ${row.req.title_en}`;
        const pageRange = `(${row.pages} pp., pages ${row.startPage}-${row.endPage})`;
        coverPage.drawText(safeAscii(itemTitle).slice(0, 52), {
          x: 55,
          y: cy,
          size: 10.5,
          font: font,
          color: rgb(0.15, 0.2, 0.25)
        });
        coverPage.drawText(safeAscii(pageRange), {
          x: 410,
          y: cy,
          size: 10.5,
          font: font,
          color: rgb(0.35, 0.4, 0.45)
        });
        cy -= 18;
      }
    });

    // Optional Stamp on Cover
    if (sealImageBytes && $("chkSeal").checked) {
      try {
        const sealImg = await outPdf.embedPng(sealImageBytes);
        const sealDims = sealImg.scale(0.35);
        coverPage.drawImage(sealImg, {
          x: 595.28 - sealDims.width - 50,
          y: FOOTER_HEIGHT + 40,
          width: sealDims.width,
          height: sealDims.height
        });
      } catch(e) {}
    }

    // ==========================================
    // BONUS: PAGE 2: INDEX / TABLE OF CONTENTS
    // ==========================================
    if (isIndexPageRequested) {
      const idxPage = outPdf.addPage([595.28, 841.89 + FOOTER_HEIGHT]);
      let iy = 841.89 + FOOTER_HEIGHT - 65;
      idxPage.drawText("Table of Contents / Document Index", {
        x: 50,
        y: iy,
        size: 20,
        font: boldFont,
        color: rgb(0.06, 0.32, 0.45)
      });
      iy -= 30;

      // Table Header
      idxPage.drawText("No.", { x: 50, y: iy, size: 10, font: boldFont, color: rgb(0.1, 0.15, 0.2) });
      idxPage.drawText("Document Title", { x: 80, y: iy, size: 10, font: boldFont, color: rgb(0.1, 0.15, 0.2) });
      idxPage.drawText("File Name", { x: 260, y: iy, size: 10, font: boldFont, color: rgb(0.1, 0.15, 0.2) });
      idxPage.drawText("Pages", { x: 440, y: iy, size: 10, font: boldFont, color: rgb(0.1, 0.15, 0.2) });
      idxPage.drawText("Start Page", { x: 500, y: iy, size: 10, font: boldFont, color: rgb(0.1, 0.15, 0.2) });
      iy -= 15;

      mappedRows.forEach(row => {
        if (iy > FOOTER_HEIGHT + 30) {
          idxPage.drawText(`${row.req.order}`, { x: 50, y: iy, size: 10, font });
          idxPage.drawText(safeAscii(row.req.title_en).slice(0, 30), { x: 80, y: iy, size: 10, font });
          idxPage.drawText(safeAscii(row.file.name).slice(0, 28), { x: 260, y: iy, size: 9, font });
          idxPage.drawText(`${row.pages}`, { x: 440, y: iy, size: 10, font });
          idxPage.drawText(`${row.startPage}`, { x: 500, y: iy, size: 10, font: boldFont });
          iy -= 18;
        }
      });
    }

    // ==========================================
    // 6.2 DOCUMENT PAGES (Preserving layout & adding footer margin)
    // ==========================================
    for (const row of mappedRows) {
      const embeddedPages = await outPdf.embedPdf(row.srcDoc, row.srcDoc.getPageIndices());
      embeddedPages.forEach(emb => {
        // Add page with extra footer height so content is NEVER covered (6.4)
        const p = outPdf.addPage([emb.width, emb.height + FOOTER_HEIGHT]);
        p.drawPage(emb, { x: 0, y: FOOTER_HEIGHT });
      });
    }

    // ==========================================
    // CUSTOM WATERMARK & PNG LOGO
    // ==========================================
    const hasWatermark = $("chkWatermark") && $("chkWatermark").checked;
    let wmType = "text";
    const wmTypeRadio = document.querySelector('input[name="wmType"]:checked');
    if (wmTypeRadio) wmType = wmTypeRadio.value;

    const wmTarget = (document.querySelector('input[name="wmTarget"]:checked') || {}).value || "all";
    const wmCustomText = ($("wmTextInput") ? $("wmTextInput").value : "CONFIDENTIAL").trim();
    const wmColorMode = $("wmTextColor") ? $("wmTextColor").value : "red";
    const wmTextOpacity = parseFloat($("wmTextOpacity") ? $("wmTextOpacity").value : 0.18) || 0.18;
    const wmLogoPos = $("wmLogoPosition") ? $("wmLogoPosition").value : "center";
    const wmLogoOpacity = parseFloat($("wmLogoOpacity") ? $("wmLogoOpacity").value : 1.0) || 1.0;

    let wmColor = rgb(0.85, 0.2, 0.2); // Red
    if (wmColorMode === "gray") wmColor = rgb(0.5, 0.5, 0.5);
    if (wmColorMode === "blue") wmColor = rgb(0.12, 0.35, 0.7);

    let embeddedLogoImg = null;
    if (hasWatermark && wmType === "png" && watermarkPngBytes) {
      try {
        embeddedLogoImg = await outPdf.embedPng(watermarkPngBytes);
      } catch(e) {
        console.warn("Failed embedding PNG logo:", e);
      }
    }

    // ==========================================
    // 6.3 & 6.4 FOOTER AND WATERMARK ON EVERY PAGE
    // <tender_id> | Page X of Y
    // ==========================================
    const allPages = outPdf.getPages();
    allPages.forEach((p, idx) => {
      const isCover = (idx === 0);
      const shouldApplyWm = hasWatermark && (
        wmTarget === "all" ||
        (wmTarget === "cover" && isCover) ||
        (wmTarget === "docs" && !isCover)
      );

      if (shouldApplyWm) {
        const { width, height } = p.getSize();
        if (wmType === "text" && wmCustomText) {
          const fontSize = Math.min(width, height) * 0.11;
          const textWidth = boldFont.widthOfTextAtSize(wmCustomText, fontSize);
          p.drawText(safeAscii(wmCustomText), {
            x: (width - textWidth * 0.707) / 2,
            y: (height - textWidth * 0.707) / 2,
            size: fontSize,
            font: boldFont,
            color: wmColor,
            rotate: degrees(45),
            opacity: wmTextOpacity
          });
        } else if (wmType === "png" && embeddedLogoImg) {
          if (wmLogoPos === "center") {
            const maxSize = Math.min(width, height) * 0.5;
            const dims = embeddedLogoImg.scaleToFit(maxSize, maxSize);
            p.drawImage(embeddedLogoImg, {
              x: (width - dims.width) / 2,
              y: (height - dims.height) / 2,
              width: dims.width,
              height: dims.height,
              opacity: wmLogoOpacity
            });
          } else if (wmLogoPos === "header") {
            const dims = embeddedLogoImg.scaleToFit(110, 45);
            p.drawImage(embeddedLogoImg, {
              x: width - dims.width - 35,
              y: height - dims.height - 25,
              width: dims.width,
              height: dims.height,
              opacity: wmLogoOpacity
            });
          } else { // bottom-right seal
            const dims = embeddedLogoImg.scaleToFit(110, 110);
            p.drawImage(embeddedLogoImg, {
              x: width - dims.width - 45,
              y: FOOTER_HEIGHT + 20,
              width: dims.width,
              height: dims.height,
              opacity: wmLogoOpacity
            });
          }
        }
      }

      const footerString = `${tenderData.tender_id} | Page ${idx + 1} of ${totalPackagePages}`;
      const textWidth = font.widthOfTextAtSize(footerString, 9.5);
      const centerX = (p.getWidth() - textWidth) / 2;
      p.drawText(safeAscii(footerString), {
        x: centerX,
        y: 11,
        size: 9.5,
        font: font,
        color: rgb(0.2, 0.25, 0.3)
      });
    });

    const finalPdfBytes = await outPdf.save();
    const pdfBlob = new Blob([finalPdfBytes], { type: "application/pdf" });
    
    if (generatedPackage && generatedPackage.url) {
      URL.revokeObjectURL(generatedPackage.url);
    }

    const blobUrl = URL.createObjectURL(pdfBlob);
    generatedPackage = {
      blob: pdfBlob,
      url: blobUrl,
      size: finalPdfBytes.length,
      pages: totalPackagePages
    };

    addToast(t("packageBuilt")(totalPackagePages, finalPdfBytes.length), "ok");
  } catch (err) {
    console.error("PDF generation error:", err);
    addToast(t("buildFail") + " (" + err.message + ")", "err");
  } finally {
    const btn = $("btnGenerate");
    if (btn) btn.disabled = false;
    if ($("txtBtnGen")) $("txtBtnGen").textContent = t("genBtn");
  }

  render();
}

    $("tenderContent").innerHTML = `
      <div class="tender-meta">
        <div class="meta-item">
          <span class="lbl">${escapeHtml(t("tId"))}</span>
          <span class="val">${escapeHtml(tenderData.tender_id)}</span>
        </div>
        <div class="meta-item">
          <span class="lbl">${escapeHtml(t("tTitle"))}</span>
          <span class="val">${escapeHtml(tenderData.title)}</span>
        </div>
        <div class="meta-item">
          <span class="lbl">${escapeHtml(t("tEntity"))}</span>
          <span class="val">${escapeHtml(tenderData.procuring_entity)}</span>
        </div>
        <div class="meta-item">
          <span class="lbl">${escapeHtml(t("tBidder"))}</span>
          <span class="val">${escapeHtml(tenderData.bidder)}</span>
        </div>
        <div class="meta-item">
          <span class="lbl">${escapeHtml(t("tDeadline"))}</span>
          <span class="val deadline">${escapeHtml(tenderData.submission_deadline)}</span>
        </div>
      </div>
      <div class="stats-ribbon">
        <span class="stat-chip"><span class="led" style="background:var(--ok);box-shadow:0 0 6px var(--ok-glow);"></span> ${escapeHtml(t("OK"))}: ${stats.OK}</span>
        <span class="stat-chip"><span class="led" style="background:var(--bad);box-shadow:0 0 6px var(--bad-glow);"></span> ${escapeHtml(t("Missing"))}: ${stats.Missing}</span>
        <span class="stat-chip"><span class="led" style="background:var(--warn);box-shadow:0 0 6px var(--warn-glow);"></span> ${escapeHtml(t("NeedExp"))}: ${stats.NeedExp}</span>
        <span class="stat-chip"><span class="led" style="background:var(--bad);box-shadow:0 0 6px var(--bad-glow);"></span> ${escapeHtml(t("Expired"))}: ${stats.Expired}</span>
        <span class="stat-chip"><span class="led" style="background:var(--gr);box-shadow:0 0 6px rgba(100,116,139,0.5);"></span> ${escapeHtml(t("NotProv"))}: ${stats.NotProv}</span>
      </div>
    `;
  }

  // Render Requirements List
  if (!requirements.length) {
    $("reqsList").innerHTML = "";
  } else {
    $("reqsList").innerHTML = requirements.map(r => {
      const s = evaluateStatus(r);
      const matchedFile = getFileById(matches[r.id]);
      const eligibleList = getEligibleFiles(r.id);
      if (matchedFile && !eligibleList.some(x => x.id === matchedFile.id)) {
        eligibleList.push(matchedFile);
      }

      const title = currentLang === "bn" ? r.title_bn : r.title_en;
      const expVal = expiryDates[r.id] || "";
      
      let expFeedback = "";
      if (r.has_expiry && matchedFile && expVal) {
        if (tenderData && expVal < tenderData.submission_deadline) {
          expFeedback = `<span class="exp-hint invalid">${escapeHtml(t("expBeforeDl"))}</span>`;
        } else {
          expFeedback = `<span class="exp-hint valid">${escapeHtml(t("validDate")(expVal))}</span>`;
        }
      }

      return `
        <div class="req">
          <div class="req-header">
            <div class="req-title">
              <span class="req-order">${r.order}</span>
              <span>${escapeHtml(title)}</span>
            </div>
            <div class="req-badges">
              <span class="pill ${r.mandatory ? 'pill-mand' : ''}">${r.mandatory ? escapeHtml(t("mand")) : escapeHtml(t("opt"))}</span>
              ${r.has_expiry ? `<span class="pill pill-exp">${escapeHtml(t("expReq"))}</span>` : ''}
              <span class="tag ${s}">${escapeHtml(t(s))}</span>
            </div>
          </div>
          <div class="req-controls">
            <select data-req="${r.id}" aria-label="${escapeHtml(r.title_en)}">
              <option value="">${escapeHtml(t("chooseFile"))}</option>
              ${eligibleList.map(f => `
                <option value="${f.id}" ${matchedFile && matchedFile.id === f.id ? "selected" : ""}>
                  ${escapeHtml(f.name)} (${f.pages} ${escapeHtml(t("pages"))})
                </option>
              `).join("")}
            </select>
            ${r.has_expiry && matchedFile ? `
              <div class="exp-field">
                <label>${escapeHtml(t("expDate"))}:</label>
                <input type="date" data-exp="${r.id}" value="${escapeHtml(expVal)}">
                ${expFeedback}
              </div>
            ` : ""}
            ${matchedFile ? `<button class="btn btn-sm btn-danger" data-unmatch="${r.id}">&times;</button>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  // Render Generation Validation & Blocking Reasons (Task 4.7)
  const blockingIssues = requirements.filter(r => isBlockingStatus(evaluateStatus(r)));
  const genBtn = $("btnGenerate");

  if (!tenderData || !requirements.length) {
    $("genStatusContainer").innerHTML = "";
    genBtn.disabled = true;
  } else if (blockingIssues.length > 0) {
    const listHtml = blockingIssues.map(r => {
      const docName = currentLang === "bn" ? r.title_bn : r.title_en;
      const statName = t(evaluateStatus(r));
      return `<li><b>${escapeHtml(docName)}</b> — <span style="font-weight:600">${escapeHtml(statName)}</span></li>`;
    }).join("");

    $("genStatusContainer").innerHTML = `
      <div class="blocking-box">
        <b>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          ${escapeHtml(t("blkMsg"))}
        </b>
        <ul>${listHtml}</ul>
      </div>
    `;
    genBtn.disabled = true;
  } else {
    $("genStatusContainer").innerHTML = `
      <div class="ready-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span><b>${escapeHtml(t("readyMsg"))}</b></span>
      </div>
    `;
    genBtn.disabled = false;
  }

  // Download Button Slot (Task 4.8)
  const downloadSlot = $("downloadBtnSlot");
  const summarySlot = $("packageSummarySlot");
  if (generatedPackage && tenderData) {
    const fileName = `${tenderData.tender_id}_Package.pdf`;
    downloadSlot.innerHTML = `
      <a class="btn btn-success" href="${generatedPackage.url}" download="${escapeHtml(fileName)}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        ${escapeHtml(t("downloadBtn"))} (${escapeHtml(fileName)})
      </a>
      <a class="btn" href="${generatedPackage.url}" target="_blank" rel="noopener">
        ${escapeHtml(t("previewBtn"))}
      </a>
    `;
    summarySlot.innerHTML = `
      <div class="pdf-summary">
        <div>
          <b>${escapeHtml(fileName)}</b><br>
          <small style="color:var(--mu);">${generatedPackage.pages} ${escapeHtml(t("pages"))} · ${(generatedPackage.size/1024).toFixed(1)} KB</small>
        </div>
        <span class="tag OK">✓ Verified</span>
      </div>
    `;
  } else {
    downloadSlot.innerHTML = "";
    summarySlot.innerHTML = "";
  }

  // Render Uploaded Files (Task 4.2 & 4.6)
  $("uploadedFilesList").innerHTML = uploadedFiles.map(f => {
    const duplicates = getFilesWithSameHash(f);
    const isDuplicate = duplicates.length > 1;
    const otherDup = isDuplicate ? duplicates.find(x => x.id !== f.id) : null;

    return `
      <div class="file-item">
        <div class="file-info">
          <span class="file-name">${escapeHtml(f.name)}</span>
          <div class="file-meta">
            <span>${f.pages} ${escapeHtml(t("pages"))}</span>
            <span>·</span>
            <span>${(f.size/1024).toFixed(1)} KB</span>
            ${isDuplicate ? `<span class="tag dup">${escapeHtml(t("dup"))}: ${escapeHtml(t("dupOf")(otherDup ? otherDup.name : ""))}</span>` : ""}
          </div>
        </div>
        <button class="btn btn-sm btn-danger" data-remove-file="${f.id}" title="${escapeHtml(t("remove"))}">&times;</button>
      </div>
    `;
  }).join("");

  // Attach dynamic event listeners
  document.querySelectorAll("[data-req]").forEach(el => {
    el.onchange = () => setRequirementMatch(el.dataset.req, el.value);
  });
  document.querySelectorAll("[data-exp]").forEach(el => {
    el.onchange = () => setExpiryDate(el.dataset.exp, el.value);
  });
  document.querySelectorAll("[data-unmatch]").forEach(el => {
    el.onclick = () => setRequirementMatch(el.dataset.unmatch, "");
  });
  document.querySelectorAll("[data-remove-file]").forEach(el => {
    el.onclick = () => removeFile(parseInt(el.dataset.removeFile, 10));
  });
}

// Event Bindings
$("reqInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    if (!json.tender || !Array.isArray(json.requirements) || !json.tender.tender_id || !/^\d{4}-\d{2}-\d{2}$/.test(json.tender.submission_deadline)) {
      throw new Error("Invalid schema");
    }
    tenderData = json.tender;
    requirements = [...json.requirements].sort((a,b) => a.order - b.order);
    matches = {};
    expiryDates = {};
    generatedPackage = null;
    saveToLocalStorage();
    addToast("requirements.json loaded successfully!", "ok");
  } catch (err) {
    addToast(t("badReq"), "err");
  }
  e.target.value = "";
  render();
};

$("pdfInput").onchange = async e => {
  if (e.target.files.length) {
    await handleFilesUpload([...e.target.files]);
  }
  e.target.value = "";
};

// Drag and drop support
const dropZone = $("dropZone");
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add("dragover"); };
dropZone.ondragleave = () => dropZone.classList.remove("dragover");
dropZone.ondrop = async e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    await handleFilesUpload([...e.dataTransfer.files]);
  }
};

$("btnLangToggle").onclick = () => {
  currentLang = currentLang === "en" ? "bn" : "en";
  saveToLocalStorage();
  render();
};

$("btnAutoMatch").onclick = autoMatchDocuments;
$("btnSamplePack").onclick = loadSamplePackDemo;
$("btnExportCsv").onclick = exportChecklistCsv;
$("btnGenerate").onclick = generatePackage;

$("btnSaveProj").onclick = exportProjectJson;
$("projInput").onchange = e => {
  if (e.target.files[0]) importProjectJson(e.target.files[0]);
  e.target.value = "";
};

$("btnClearAll").onclick = () => {
  if (confirm(t("clearConfirm"))) {
    tenderData = null;
    requirements = [];
    uploadedFiles = [];
    matches = {};
    expiryDates = {};
    generatedPackage = null;
    toastMessages = [];
    localStorage.removeItem("devfest_tender_builder_state");
    render();
  }
};

let watermarkPngBytes = null;

if ($("chkWatermark")) {

    $("watermarkPanel").style.display = e.target.checked ? "block" : "none";
  };
}

document.querySelectorAll('input[name="wmType"]').forEach(r => {
  r.onchange = () => {
    const isText = r.value === "text";
    $("wmTextControls").style.display = isText ? "flex" : "none";
    $("wmPngControls").style.display = isText ? "none" : "flex";
  };
});

if ($("wmLogoInput")) {
  $("wmLogoInput").onchange = async e => {
    const file = e.target.files[0];
    if (file) {
      watermarkPngBytes = new Uint8Array(await file.arrayBuffer());
      $("wmLogoFileName").textContent = file.name;
      addToast(t("logoLoaded")(file.name), "ok");
    }
    e.target.value = "";
  };
}

// Initial load
loadFromLocalStorage();

    { id: 7, name: "02_technical_proposal.pdf", pages: 6, size: 9286, hash: "h_tech" },
    { id: 8, name: "01_financial_proposal.pdf", pages: 2, size: 4060, hash: "h_fin" },
    { id: 9, name: "scan_0042.pdf", pages: 1, size: 171663, hash: "h_dec" }
  ];
  matches = {
